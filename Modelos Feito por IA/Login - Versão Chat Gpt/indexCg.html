<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Startups - FIAP</title>
    <link rel="stylesheet" href="styleCg.css">
    <script src="scriptCg.js"></script>
</head>
<body>

    <div class="container">
        <div id="tela-login">
            <h2>Login</h2>
            <p class="subtitulo">Acesse com suas credenciais da FIAP</p>
            
            <div class="campo">
                <label for="usuario">Usuário:</label>
                <input type="text" id="usuario" placeholder="Digite seu usuário">
            </div>
            
            <div class="campo">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" placeholder="Digite sua senha">
            </div>
            
            <button onclick="executarLogin()">Entrar</button>
            <p id="mensagem-erro" class="erro"></p>
        </div>

        <div id="tela-crud" class="oculto">
            <h2>💡 Banco de Ideias para Startups</h2>
            
            <div class="formulario-crud">
                <input type="text" id="nova-ideia" placeholder="Digite uma nova ideia de negócio...">
                <div class="botoes-grupo">
                    <button onclick="adicionarNoInicio()" class="btn-secundario">Adicionar no Início</button>
                    <button onclick="adicionarNoFinal()" class="btn-principal">Adicionar no Final</button>
                </div>
            </div>

            <ul id="lista-renderizada"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
